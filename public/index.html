<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nourish Overlord</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./bmr.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>

  <header>
    <h1>Nourish Overlord</h1>
  </header>

  <main>

    <!-- SECTION 1: Profile -->
    <section id="profile-section">
      <h2>Your Profile</h2>
      <form id="profile-form">
        <div>
          <label for="username">Name</label>
          <input type="text" id="username" placeholder="Your name" autocomplete="on">
        </div>
        <div>
          <label for="gender">Gender</label>
          <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div>
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Years">
        </div>
        <div>
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" placeholder="kg">
        </div>
        <div>
          <label for="height">Height (cm)</label>
          <input type="number" id="height" placeholder="cm">
        </div>
        <div>
          <label for="goal">Goal</label>
          <select id="goal">
            <option value="lose">Lose weight</option>
            <option value="maintain">Maintain weight</option>
            <option value="gain">Gain weight</option>
          </select>
        </div>
        <div>
          <label for="activity-level">Activity Level</label>
          <select id="activity-level">
            <option value="sedentary">Sedentary</option>
            <option value="light">Light</option>
            <option value="moderate">Moderate</option>
            <option value="active">Active</option>
            <option value="very active">Very Active</option>
          </select>
        </div>
        <button type="submit">Save Profile</button>
      </form>
    </section>

    <!-- SECTION 2: Dashboard -->
    <section id="dashboard-section">
      <div id="dashboard-left">
        <h2>Today's Dashboard</h2>
        <div id="calorie-target"><span>Daily Target:</span><span>--</span><span>kcal</span></div>
        <div id="calories-consumed"><span>Consumed:</span><span>--</span><span>kcal</span></div>
        <div id="fat-consumed"><span>Fat:</span><span>--</span><span>g</span></div>
        <div id="carbohydrates-consumed"><span>Carbohydrates:</span><span>--</span><span>g</span></div>
        <div id="protein-consumed"><span>Protein:</span><span>--</span><span>g</span></div>
        <div id="calories-burned"><span>Burned:</span><span>--</span><span>kcal</span></div>
        <div id="calories-remaining"><span>Remaining:</span><span>--</span><span>kcal</span></div>
      </div>
      <fieldset id="overlord">
        <legend>Choose your Overlord</legend>
        <div>
          <input type="radio" name="overlord" id="default" value="default">
          <label for="default">Default</label>
        </div>
        <div>
          <input type="radio" name="overlord" id="angry-chef" value="chef">
          <label for="angry-chef">Angry Chef</label>
        </div>
        <div>
          <input type="radio" name="overlord" id="robot" value="robot" checked>
          <label for="robot">Robot</label>
        </div>
        <div>
          <input type="radio" name="overlord" id="medieval-peasant" value="peasant">
          <label for="medieval-peasant">Medieval Peasant</label>
        </div>
        <div>
          <input type="radio" name="overlord" id="conspiracy-theorist" value="theorist">
          <label for="conspiracy-theorist">Conspiracy Theorist</label>
        </div>
        <div>
          <input type="radio" name="overlord" id="therapist" value="therapist">
          <label for="therapist">Therapist</label>
        </div>
        <div>
          <input type="radio" name="overlord" id="drill-sergeant" value="sergeant">
          <label for="drill-sergeant">Drill Sergeant</label>
        </div>
      </fieldset>
    </section>

    <!-- SECTION 3: Meal Log -->
    <section id="meal-section">
      <form id="meal-form">
        <h2>Log a Meal</h2>
        <div>
          <input type="text" id="meal-input" placeholder="e.g. 2 eggs and toast">
          <button id="log-meal-btn">Log Meal</button>
        </div>

      </form>
      <div id="reaction-box">
        <p id="reaction-text"></p>
      </div>
    </section>

    <!-- SECTION 4: Activity Log -->
    <section id="activity-section">
      <form id="activity-form">
        <h2>Log Activity / Time</h2>
        <div>
          <input type="text" id="activity-type" placeholder="activity type">
          <input type="number" id="activity-duration" placeholder="duration in minutes" max="1000">
          <button id="log-activity-btn">Log Activity</button>
        </div>
        <ul id="activity-list">
          <!-- activities appear here -->
        </ul>
      </form>
    </section>

    <!-- SECTION 5: Daily Summary -->
    <section id="summary-section">
      <div class="top-div">
        <h2>Daily Summary</h2>
        <div id="recently-deleted-div">
          <label for="recently-deleted">Deleted</label>
          <select id="recently-deleted">
            <option value="None">None</option>
          </select>
        </div>
      </div>
      <div id="summary-content">
        <ul id="meal-list">
          <!-- meals appear here -->
        </ul>
      </div>
    </section>

    <!-- SECTION 6: Save / Load -->
    <section id="save-load-section">
      <h2>Save / Load Data</h2>
      <button id="save-btn">Download My Data</button>
      <button id="load-btn">Load Data File</button>
      <input type="file" id="file-input" accept=".json">
    </section>

  </main>

  <script>
    let restoring = false;
    
    setInterval(() => {
      if (!restoring && window.scrollY > 0) {
        sessionStorage.setItem('scrollPos', window.scrollY);
        console.log('saved', window.scrollY);
      }
    }, 1000);

    const restoreScroll = () => {
      const pos = parseInt(sessionStorage.getItem('scrollPos'));
      console.log('onload, pos from storage:', pos, 'page height:', document.body.scrollHeight);
      if (!pos) return;
      restoring = true;
      const tryScroll = () => {
        console.log('try scroll to', pos, '| height:', document.body.scrollHeight);
        if (document.body.scrollHeight > pos) {
          window.scrollTo(0, pos);
          setTimeout(() =>{
            window.scrollTo(0, pos);
            restoring = false;
          }, 500);
        } else {
          requestAnimationFrame(tryScroll);
        }
      };
      requestAnimationFrame(tryScroll);
    };

    window.onload = restoreScroll;

    new MutationObserver(restoreScroll).observe(document.head, {
      subtree: true, attributes: true, attributeFilter: ['href']
    });
  </script>

</body>

</html>
